[project]
name = "sentryguard"
version = "0.1.0"
description = "Real-time fraud risk scoring API with Logistic Regression and XGBoost."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.1",
    "xgboost>=2.1.0",
    "joblib>=1.4.2",
    "shap>=0.46.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[dependency-groups]
training = [
    "imbalanced-learn>=0.12.3",
    "kaggle>=1.6.17",
    "loguru>=0.7.2",
]
dev = [
    "bandit>=1.7.9",
    "httpx>=0.27.0",
    "httpx2>=2.5.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.3",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
